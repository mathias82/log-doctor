receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: log-doctor
          metrics_path: /metrics
          scrape_interval: 15s
          static_configs:
            - targets: ["host.docker.internal:8080"]

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [debug]
