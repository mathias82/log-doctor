name: Log Doctor

description: Analyze a JVM/Spring/Kafka log with Log Doctor and emit GitHub workflow annotations.

inputs:
  log-file:
    description: Path to the log file to analyze.
    required: true
  fail-on:
    description: "Failure policy: none, diagnosis, high, or critical."
    required: false
    default: none

outputs:
  exit-code:
    description: Log Doctor CLI exit code.
    value: ${{ steps.analyze.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: ${{ github.action_path }}/pom.xml

    - name: Build Log Doctor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: mvn --batch-mode --no-transfer-progress -DskipTests package

    - name: Analyze log
      id: analyze
      shell: bash
      run: |
        set +e
        jar="$(find "${{ github.action_path }}/target" -maxdepth 1 -type f -name 'log-doctor-*.jar' -print -quit)"
        if [[ -z "$jar" ]]; then
          echo "Log Doctor executable JAR was not produced" >&2
          echo "exit-code=3" >> "$GITHUB_OUTPUT"
          exit 3
        fi
        java -jar "$jar" \
          --file "${{ inputs.log-file }}" \
          --format github \
          --fail-on "${{ inputs.fail-on }}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
