<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#09111d"/><rect x="90" y="70" width="1260" height="580" rx="24" fill="#09121e" stroke="#21364b"/><text x="130" y="125" fill="#e8eef7" font-family="Arial" font-size="26" font-weight="700">Incident group detail</text><text x="130" y="158" fill="#7f93aa" font-family="Arial" font-size="14">Explainable diagnosis with provenance, evidence and remediation</text><rect x="130" y="195" width="1180" height="120" rx="16" fill="#0b1724" stroke="#1d3348"/><text x="160" y="235" fill="#e8eef7" font-family="Arial" font-size="19" font-weight="700">143 × CONCURRENCY_FAILURE</text><rect x="470" y="212" width="130" height="30" rx="15" fill="#4ade801f"/><text x="535" y="232" text-anchor="middle" fill="#86efac" font-family="Arial" font-size="11" font-weight="700">DETERMINISTIC</text><rect x="615" y="212" width="125" height="30" rx="15" fill="#fbbf241f"/><text x="677" y="232" text-anchor="middle" fill="#fcd34d" font-family="Arial" font-size="11" font-weight="700">HUMAN REVIEW</text><rect x="1160" y="212" width="95" height="30" rx="15" fill="#fbbf241f"/><text x="1207" y="232" text-anchor="middle" fill="#fcd34d" font-family="Arial" font-size="11" font-weight="700">HIGH</text><text x="160" y="272" fill="#b9c9d9" font-family="Arial" font-size="14">Concurrency / data consistency failure</text><text x="160" y="297" fill="#70879d" font-family="Arial" font-size="12">THREADING · Persistence concurrency · Fix policy: NO_AUTOMATIC_FIX</text><rect x="130" y="340" width="370" height="245" rx="16" fill="#0b1724" stroke="#1d3348"/><text x="155" y="375" fill="#6f8398" font-family="Arial" font-size="11" font-weight="700">ROOT CAUSE</text><text x="155" y="410" fill="#cfdae6" font-family="monospace" font-size="12">Concurrent database access changed</text><text x="155" y="432" fill="#cfdae6" font-family="monospace" font-size="12">or locked state expected by this</text><text x="155" y="454" fill="#cfdae6" font-family="monospace" font-size="12">operation.</text><rect x="535" y="340" width="370" height="245" rx="16" fill="#0b1724" stroke="#1d3348"/><text x="560" y="375" fill="#6f8398" font-family="Arial" font-size="11" font-weight="700">EVIDENCE</text><text x="560" y="410" fill="#fca5a5" font-family="monospace" font-size="12">org.hibernate.OptimisticLockException:</text><text x="560" y="432" fill="#cfdae6" font-family="monospace" font-size="12">row was updated by another transaction</text><text x="560" y="476" fill="#7f93aa" font-family="Arial" font-size="12">First: 10:14:31 · Last: 10:17:04</text><rect x="940" y="340" width="370" height="245" rx="16" fill="#0b1724" stroke="#1d3348"/><text x="965" y="375" fill="#6f8398" font-family="Arial" font-size="11" font-weight="700">REMEDIATION</text><text x="965" y="410" fill="#cfdae6" font-family="monospace" font-size="12">Investigate transaction boundaries,</text><text x="965" y="432" fill="#cfdae6" font-family="monospace" font-size="12">lock ordering and retry semantics;</text><text x="965" y="454" fill="#cfdae6" font-family="monospace" font-size="12">do not apply an automatic fix.</text><text x="130" y="625" fill="#53677c" font-family="Arial" font-size="12">Determinism before AI · Safety before automation · Local-first</text></svg>