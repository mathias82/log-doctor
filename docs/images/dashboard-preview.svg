<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Log Doctor uploaded log analysis dashboard</title>
  <desc id="desc">Log Doctor web UI showing a selected log file, automatic analysis status, and a structured diagnosis result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17304f"/><stop offset="0.42" stop-color="#09111d"/><stop offset="1" stop-color="#060b12"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8eef7}.m{fill:#9fb0c4}.label{fill:#6f8398;font-size:10px;font-weight:700;letter-spacing:1px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#cfdae6;font-size:11px}.card{fill:#09121e;stroke:#21364b}.inner{fill:#0b1724;stroke:#1d3348}.small{font-size:11px}.body{font-size:12px}.h2{font-size:18px;font-weight:700}.h1{font-size:38px;font-weight:800}.strong{font-weight:800}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g transform="translate(38 30)">
    <text class="t" x="0" y="16" font-size="10" font-weight="800" letter-spacing="2" fill="#7dd3fc">LOCAL-FIRST JVM DIAGNOSTICS</text>
    <text class="t h1" x="0" y="62">🩺 Log Doctor</text>
    <text class="t m" x="0" y="88" font-size="13">Upload a log file and get a structured diagnosis automatically.</text>
    <rect x="982" y="8" rx="18" width="140" height="34" fill="#0a1523" stroke="#243b53"/><circle cx="1001" cy="25" r="5" fill="#4ade80"/><text class="t small" x="1014" y="29">Local analysis</text>
  </g>

  <g transform="translate(38 132)" filter="url(#shadow)">
    <rect class="card" width="490" height="506" rx="20"/>
    <text class="t h2" x="20" y="34">Log input</text><text class="t m small" x="20" y="54">Upload or drop .log / .txt files</text>
    <rect x="20" y="78" width="450" height="92" rx="14" fill="#0b1725" stroke="#38bdf8" stroke-dasharray="6 5"/>
    <text class="t body strong" x="145" y="110">application-prod.log</text><text class="t m small" x="154" y="132">18.4 KB · analyzing automatically</text><text class="t small" x="186" y="151" fill="#86efac">✓ File loaded locally</text>
    <line x1="20" y1="191" x2="185" y2="191" stroke="#1f3347"/><text class="t m small" x="205" y="195">log contents</text><line x1="282" y1="191" x2="470" y2="191" stroke="#1f3347"/>
    <rect x="20" y="211" width="450" height="225" rx="14" fill="#07111c" stroke="#20364b"/>
    <text class="mono" x="34" y="236">2026-09-01 10:42:13 ERROR DispatcherServlet</text><text class="mono" x="34" y="257">Request processing failed</text><text class="mono" x="34" y="287">Caused by: org.hibernate.LazyInitializationException:</text><text class="mono" x="34" y="308">could not initialize proxy - no Session</text><text class="mono" x="34" y="338">at CustomerService.toDto(CustomerService.java:74)</text>
    <text class="t m small" x="20" y="472">5 lines · 18.4 KB</text>
    <rect x="342" y="450" width="128" height="34" rx="10" fill="url(#btn)" opacity=".55"/><text x="365" y="472" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800" fill="#04111b">Analyzing…</text>
  </g>

  <g transform="translate(550 132)" filter="url(#shadow)">
    <rect class="card" width="612" height="506" rx="20"/>
    <text class="t h2" x="20" y="34">Diagnosis dashboard</text><text class="t m small" x="20" y="54">Structured incident analysis and remediation</text>
    <rect x="516" y="18" width="76" height="28" rx="14" fill="#4ade8022"/><text x="531" y="36" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="800" fill="#86efac">Diagnosed</text>
    <g transform="translate(20 77)"><rect class="inner" width="134" height="60" rx="12"/><text class="label" x="12" y="20">SEVERITY</text><text class="t strong" x="12" y="43">HIGH</text><rect class="inner" x="146" width="134" height="60" rx="12"/><text class="label" x="158" y="20">CONFIDENCE</text><text class="t strong" x="158" y="43">HIGH</text><rect class="inner" x="292" width="134" height="60" rx="12"/><text class="label" x="304" y="20">CATEGORY</text><text class="t strong" x="304" y="43">DATABASE</text><rect class="inner" x="438" width="134" height="60" rx="12"/><text class="label" x="450" y="20">MODE</text><text class="t strong" x="450" y="43">RULE</text></g>
    <rect class="inner" x="20" y="149" width="572" height="66" rx="12"/><text class="label" x="34" y="170">SUMMARY</text><text class="t" x="34" y="195" font-size="14" font-weight="700">Hibernate lazy loading outside an active session</text>
    <rect class="inner" x="20" y="227" width="280" height="96" rx="12"/><text class="label" x="34" y="248">ROOT CAUSE</text><text class="mono" x="34" y="273">LazyInitializationException</text><text class="mono" x="34" y="294">collection could not initialize</text>
    <rect class="inner" x="312" y="227" width="280" height="96" rx="12"/><text class="label" x="326" y="248">LOCATION</text><text class="mono" x="326" y="273">CustomerService.toDto</text><text class="mono" x="326" y="294">CustomerService.java:74</text>
    <rect class="inner" x="20" y="335" width="572" height="112" rx="12"/><text class="label" x="34" y="356">REMEDIATION</text><rect x="499" y="346" width="79" height="24" rx="12" fill="#4ade8022"/><text x="511" y="362" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="800" fill="#86efac">JAVA_CODE</text><line x1="35" y1="378" x2="35" y2="429" stroke="#38bdf8" stroke-width="3"/><text class="mono" x="47" y="391">@Transactional</text><text class="mono" x="47" y="410">public CustomerDto toDto(Customer customer) {</text><text class="mono" x="58" y="428">return mapper.toDto(customer);</text>
    <rect x="468" y="460" width="124" height="28" rx="9" fill="#0d1a29" stroke="#2b425b"/><text class="t small" x="489" y="478">Copy diagnosis</text>
  </g>

  <g transform="translate(38 658)"><rect class="card" width="1124" height="72" rx="18"/><text class="t" x="20" y="29" font-size="15" font-weight="700">Recent analyses</text><text class="t m small" x="20" y="48">Stored only in this browser</text><rect x="330" y="15" width="374" height="42" rx="12" fill="#0b1724" stroke="#1d3348"/><text class="t small strong" x="344" y="33">HIBERNATE_LAZY_INITIALIZATION</text><text class="t m" x="344" y="49" font-size="9">Lazy loading outside an active session</text><rect x="718" y="15" width="290" height="42" rx="12" fill="#0b1724" stroke="#1d3348"/><text class="t small strong" x="732" y="33">KAFKA_TOPIC_NOT_FOUND</text><text class="t m" x="732" y="49" font-size="9">Kafka topic was not found</text></g>
</svg>
