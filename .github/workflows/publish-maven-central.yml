name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify tag matches project version
        shell: bash
        run: |
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PROJECT_VERSION" = "$TAG_VERSION" || {
            echo "Tag $TAG_VERSION does not match pom.xml version $PROJECT_VERSION"
            exit 1
          }

      - name: Verify and package
        run: mvn -B clean verify

      - name: Generate release checksums
        shell: bash
        run: |
          mkdir -p target/release-integrity
          find target -maxdepth 1 -type f \
            \( -name '*.jar' -o -name '*.pom' \) \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print0 | sort -z | xargs -0 sha256sum > target/release-integrity/SHA256SUMS
          cat target/release-integrity/SHA256SUMS

      - name: Attest executable release artifact
        uses: actions/attest@v4
        with:
          subject-path: 'target/log-doctor-*.jar'

      - name: Upload release integrity metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-${{ github.ref_name }}
          path: target/release-integrity/SHA256SUMS
          if-no-files-found: error

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Pcentral deploy -DskipTests
