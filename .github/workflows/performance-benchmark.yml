name: Performance benchmark

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/io/github/mathias82/logdoctor/engine/PerformanceBenchmarkTest.java'
      - '.github/workflows/performance-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run performance benchmark
        run: mvn --batch-mode --no-transfer-progress -Dtest=PerformanceBenchmarkTest test

      - name: Add benchmark to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/performance-benchmark.json ]]; then
            echo "## Performance benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat target/performance-benchmark.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark
          path: target/performance-benchmark.json
          if-no-files-found: error
