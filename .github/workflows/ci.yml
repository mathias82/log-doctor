name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Java
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify browser utilities
        run: node --test src/test/js/*.test.cjs

      - name: Add diagnostic benchmark to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/diagnostic-benchmark.json ]]; then
            echo "## Diagnostic benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat target/diagnostic-benchmark.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-benchmark
          path: target/diagnostic-benchmark.json
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
